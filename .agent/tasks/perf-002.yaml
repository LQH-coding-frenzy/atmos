task:
  id: PERF-002
  title: Remediate expanded weather/AQI Worker CPU p95 over budget
  status: IN_PROGRESS
  objective: Move first-party expanded weather/AQI processing and response caching to the existing Vercel runtime, preserve public contracts and cache/stale semantics, and keep the Worker as the gateway for authenticated and lightweight edge APIs without weakening its 7 ms p95 gate.

  depends_on:
    [
      PERF-001,
      FEAT-WX-002,
      FEAT-AQI-TIMELINE-001,
      FEAT-CAL-001,
      ROUTE-001,
      OBS-007,
      REL-003,
      REL-006,
    ]

  external_policy_checks:
    - Current post-release telemetry reports CPU p95 above the 7 ms internal gate; do not claim the gate passes until an exact candidate is measured.
    - Keep the Workers Free plan and existing Open-Meteo non-commercial/weighted-call budget; do not raise CPU limits or add paid services.
    - Vercel Runtime Cache must remain within the existing Hobby included allowance (1,000,000 reads and 200,000 writes per month); stop before any overage or plan upgrade.
    - Before public cutover, enforce and test the same-origin POST policy and an owner-approved, free-tier-compatible abuse/provider-budget control covering both anonymous POST handlers and the dynamic homepage share-link query path; the current per-instance in-flight map and provider quota guard are not global limits.
    - Project shared team-level Vercel Runtime Cache and Open-Meteo usage below the 70% warning thresholds before release; no production capacity claim is valid without a measured request-volume baseline.
    - Vercel CLI pricing confirms Hobby includes 1,000,000 WAF allowed requests/month. The approved rule is active at 60 requests per 10 minutes/IP for `/` OR `/api/public/v1/weather/`; Team Usage showed 9.7K CDN requests/1M over 30 days but no WAF-specific meter. HOLD at 700,000/month and stop before any charge/plan change. Per-region counters are not a global provider quota.
    - Any candidate upload, bounded provider workload, production route/traffic change, WAF rule configuration/publish, or rollback requires separate explicit owner approval.
    - The Worker-to-Next.js service credential remains necessary only for the retained compatibility transform routes; do not create or rotate it in this local remediation. New public routes do not use it.
    - Use only sanitized analytics; do not log raw URLs, query strings, coordinates, provider payloads, user IDs, emails, JWTs, or credentials.

  runtime_placement:
    allowed: [cloudflare-worker, vercel-nextjs]
    selected: vercel-nextjs
    reason: Exact-version CPU remained above 7 ms after moving provider normalization and cache-variant serialization. Move first-party public weather/AQI handling and normalized-response caching to the existing Next.js runtime; retain the Worker for authenticated APIs and lightweight edge controls.

  scope:
