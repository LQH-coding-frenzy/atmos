    terraform_resources: []
    database_changes: [none]
    deployed_units:
      - Stable Cloudflare Worker 2503a1f0-985f-4026-a368-bd9bb5504d23 / release d81923250215 at 100%; candidate a998dabc-c89b-48bc-a336-ae9358e3bce6 / release 5105fa59910b at 0% in deployment ccafc4af-8010-4aec-ac7f-4493264a6049
      - 'Vercel Hobby WAF rule `PERF-002 public weather abuse guard` active: `/` OR `/api/public/v1/weather/`, 60 requests/10 minutes/IP, 429 on excess, published 2026-10-30 after owner approval.'

  compatibility:
    requires_expand_contract: false
    stable_version_compatible: true
    rollback_window: Retain the current and previous immutable Worker/function releases; no persisted schema changes are introduced.

  validation:
    commands:
      - corepack pnpm exec vitest run packages/provider-openmeteo packages/contracts workers/gateway/src/index.test.ts workers/gateway/src/air-quality-timeline.test.ts workers/gateway/src/request-analytics.test.ts
      - corepack pnpm exec vitest run packages/provider-openmeteo/src/full-weather.test.ts packages/provider-openmeteo/src/air-quality-timeline.test.ts
      - corepack pnpm exec vitest run apps/web/lib/weather-route-handlers.test.ts
      - corepack pnpm exec vitest run apps/web/lib/public-weather-cache.test.ts
      - corepack pnpm exec vitest run apps/web/lib/version-affinity.test.ts
      - corepack pnpm typecheck
      - corepack pnpm exec eslint packages/provider-openmeteo workers/gateway/src apps/web/app/api/v1/weather apps/web/app/api/public/v1/weather apps/web/lib/weather-route-handlers.ts apps/web/lib/weather-runtime.ts apps/web/lib/public-weather-api.ts apps/web/lib/public-weather-cache.ts apps/web/lib/public-weather-runtime.ts apps/web/lib/version-affinity.ts apps/web/components/weather-calendar-panel.tsx apps/web/components/air-quality-timeline.tsx --max-warnings=0
      - corepack pnpm --filter @atmos/gateway build
      - corepack pnpm --filter @atmos/web build
      - corepack pnpm exec playwright test tests/e2e/weather-calendar.spec.ts tests/e2e/air-quality-timeline.spec.ts --workers=1
    expected:
      - Existing 7-day and 16-day response contracts, nullable/unavailable data, timezone/DST behavior, and stale metadata remain compatible.
      - First-party public dashboard/AQI processing runs on Vercel; browser API calls use bounded same-origin POST JSON with coordinates absent from API URLs/logs. The dynamic homepage share-link query path is also included in abuse and provider-budget controls.
      - Vercel Runtime Cache stores the normalized response with five-minute freshness and a one-hour stale-if-error window; cold miss, fresh hit, revalidation success, stale fallback, hard expiry, concurrent requests, cross-instance persistence, and cache failures are tested.
      - Before release, project monthly Runtime Cache reads/writes and Open-Meteo weighted calls against expected traffic and verify they remain below the internal 70% warnings; do not enable paid/overage resources or upgrade plans.
      - Authenticated APIs remain on the Worker; first-party weather/AQI requests no longer invoke Worker weather handlers. Worker endpoints remain compatible during the rollback window.
      - Cloudflare Analytics GraphQL is filtered to exact Worker versions and bounded UTC windows; all remaining Worker routes have sufficient samples, 0 errors, and p95 CPU <= 7 ms. No samples or an empty weather route are not a CPU pass.
      - Insufficient samples or p95 above 7 ms means HOLD; never weaken the CPU threshold.
      - No user data, provider payload, token, or credential is logged or returned in evidence.

  security_checks:
    - Preserve public input validation, cache isolation, CORS, and sanitized error behavior.
    - Authenticate Worker-to-Next.js requests with the shared service token; never forward browser credentials.
    - Keep new public weather routes anonymous and read-only; apply strict request bounds and keep provider access server-only.
    - Enforce the intended same-origin request policy; reject cross-origin simple content types before provider work. CORS alone is not a request-abuse control.
    - Apply abuse/provider-budget controls to every anonymous provider entry point, including the dynamic homepage's share-link query parameters.
    - Bound server-route JSON bodies; do not forward coordinates in query strings or log request bodies/provider payloads.
    - No PII or provider payload logging.
    - Existing protected scans and contract tests pass.

  budget_checks:
    worker_cpu_budget_ms: 7
    vercel_runtime_cache_reads_month: 1000000
    vercel_runtime_cache_writes_month: 200000
    vercel_waf_rate_limit_requests_month: 1000000
    included_budget_warning_ratio: 0.7
    creates_paid_resource: false
    requires_student_credit: false

  telemetry:
    metrics: [exact Worker version CPU p50/p95/p99, request count, error count, cache status]
    logs: [sanitized failures only; no raw request or provider payloads]
    traces: [existing request correlation]

  evidence:
    - docs/evidence/preflight/2026-10-22.md
    - docs/evidence/perf-002/implementation.md

  rollback:
    strategy: Revert the frontend weather/AQI calls to the retained Worker path and restore the previous Vercel deployment if needed; retain the stable Worker/function versions; no database rollback is needed.

  human_approval:
    required: true
    reason: Creating or configuring the shared service token, any candidate upload or generated provider workload, WAF rule configuration/publish, production promotion, traffic shift, or rollback requires a separate explicit owner decision.
