task:
  id: HIST-CAP-001
  title: Authenticated user-captured weather history
  status: IN_PROGRESS
  objective: Let a signed-in user explicitly record the currently displayed Open-Meteo observation and view a bounded 7/30/90-day temperature history for the selected coordinates.
  depends_on: [FEAT-LOC-UI-001, FUNC-002, HIST-001, ROUTE-001, WEB-002]
  external_policy_checks:
    [none; uses the existing Open-Meteo dashboard response and Supabase snapshot schema]
  runtime_placement:
    allowed: [supabase-edge-function, vercel-nextjs]
    selected: supabase-edge-function
    reason: Caller-scoped snapshot reads and writes use the existing Edge API, publishable key, JWT, and RLS; the UI only records on explicit user action.
  scope:
    include:
      [
        .agent/status.yaml,
        .agent/tasks/hist-cap-001.yaml,
        supabase/functions/_shared/weather-snapshot.ts,
        supabase/functions/_shared/weather-snapshot.test.ts,
        supabase/functions/api-v1/index.ts,
        packages/contracts/src/index.ts,
        packages/contracts/src/index.test.ts,
        apps/web/components/weather-history-panel.tsx,
        apps/web/components/dashboard.tsx,
        apps/web/app/globals.css,
        tests/e2e/dashboard.spec.ts,
        README.md,
        docs/architecture/atmos-devsecops-master-plan.md,
        docs/evidence/hist-cap-001/2026-09-27.md,
      ]
    exclude:
      [
        automatic snapshot collection,
        historical provider backfill,
        external historical API,
        schema/RLS migrations,
        delete/export/aggregate APIs,
      ]
  inputs:
    required_config: [existing Supabase URL and publishable key]
    required_secrets: []
  outputs:
    files: [supabase/functions/api-v1/index.ts, apps/web/components/weather-history-panel.tsx]
    terraform_resources: []
    database_changes: [none; uses existing weather_snapshots schema and RLS]
    deployed_units: [api-v1 Edge Function, web]
  compatibility:
    requires_expand_contract: false
    stable_version_compatible: true
    rollback_window: until the previous Edge Function and Vercel releases are retired
  validation:
    commands:
      [
        corepack pnpm exec vitest run supabase/functions/_shared/weather-snapshot.test.ts packages/contracts/src/index.test.ts,
        corepack pnpm exec playwright test tests/e2e/dashboard.spec.ts,
        corepack pnpm typecheck,
        corepack pnpm test:db,
        corepack pnpm --filter @atmos/web build,
      ]
    expected:
      [
        Only validated observations are written with the authenticated caller ID; history reads are RLS-scoped,
        bounded to 90 days and 100 rows,
        and public weather stays available without sign-in.,
      ]
  security_checks: [gitleaks, codeql_or_semgrep, trivy_if_applicable, existing RLS tests]
  budget_checks:
    worker_cpu_budget_ms: 7
    creates_paid_resource: false
    requires_student_credit: false
  telemetry:
    metrics: ['existing bounded api_proxy request group only; no snapshot values or coordinates']
    logs: ['no observation payload, user email, or access token logging']
    traces: ['existing request correlation only; no snapshot payloads']
  evidence:
    [
      docs/evidence/hist-cap-001/2026-09-27.md,
      pull request checks,
      protected Edge and Vercel releases,
    ]
  rollback:
    strategy: Revert the API and UI; retain already collected user snapshots and the existing schema/RLS.
  human_approval:
    required: false
    reason: User selected the existing-snapshot history feature; writes occur only after explicit authenticated user action and add no schema, provider, or infrastructure resource.
