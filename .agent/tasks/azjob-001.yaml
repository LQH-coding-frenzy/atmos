task:
  id: AZJOB-001
  title: Define a manually triggered Azure backup Container Apps Job
  status: DONE
  objective: Add a separate Consumption Workload Profiles environment and one on-demand backup Container Apps Job, without replacing the existing Express environment or enabling a schedule.

  depends_on: [AZ-IAC-001, CTR-003]

  external_policy_checks:
    - Azure for Students subscription is Enabled; on 2026-10-10 the owner reported USD 100 total in credit with 12-month validity and approved a maximum USD 10 initial consumption for the exact two-resource apply.
    - Preserve the monthly USD 10 alert-only budget and existing USD 10 maximum initial credit-consumption approval; never upgrade to pay-as-you-go.
    - Subscription policy permits the existing environment's `indonesiacentral` region.
    - Azure returned `ExpressEnvironmentResourceNotSupported` for Jobs in the existing Express environment.
    - Read-only ARM validation accepted `environmentMode=WorkloadProfiles` with a Consumption profile in `indonesiacentral`; it created no resource at preflight. The later approved apply created the environment and job.
    - Owner selected AzAPI because pinned AzureRM 5.5 does not expose `environment_mode`; HCP OIDC was validated by a successful read-only AzAPI GET in plan run `run-U99kZLTcPLPexPtL`.
    - Use only the public immutable backup image digest and independently verify its signature and CycloneDX attestation against the protected backup-release workflow identity.
    - Keep the job manual-only, single-replica, no-retry, and bounded to 1800 seconds; configure no schedule or event trigger.
    - Owner explicitly approved the exact two-add apply and Azure secret destination on 2026-10-10; HCP run `run-6SFRZRJEtqUTy8HN` succeeded and created the approved secret copies.
    - Starting the job writes a new encrypted backup and HMAC sidecar to private R2 and consumes Azure execution resources; no execution occurred, and any run requires separate owner approval.

  runtime_placement:
    allowed: [hcp-terraform, azure-container-app-job]
    selected: hcp-terraform
    reason: HCP Terraform manages the Azure environment and manual Job through the existing OIDC-authenticated workspace; job execution is a separate manual action.

  scope:
    include:
      - infra/terraform/azure-production/main.tf
      - infra/terraform/azure-production/variables.tf
      - infra/terraform/azure-production/.terraform.lock.hcl
      - .agent/status.yaml
      - .agent/tasks/azjob-001.yaml
      - .github/workflows/verify-backup-container-supply-chain.yml
      - scripts/backup-container-verification.test.mjs
      - docs/operations/container-supply-chain.md
      - docs/evidence/azjob-001/2026-10-07.md
      - PRODUCTION-CONTINUATION.md
      - One `azapi_resource.jobs_environment` configured for Workload Profiles with only a Consumption profile
      - One manual `azurerm_container_app_job.backup` in the separate Jobs environment; keep the current Express environment unchanged
    exclude:
      - Scheduled or event-triggered backups
      - Job execution or creation of a new backup object
      - Changes to the existing Container Instance backup or restore resources
      - Restore jobs, Azure networking, Log Analytics, Azure Monitor persistence, RBAC, Key Vault, or new HCP variables
      - R2 retention/deletion policies and pay-as-you-go billing

  inputs:
    required_config:
      - Existing `atmos-azure-production` HCP Terraform workspace
      - Existing sensitive HCP variables for database URL, encryption key, and R2 credentials
      - Existing `atmos-aca-prod` Express environment remains unchanged
      - Existing HCP Azure OIDC identity variables for the AzAPI provider
      - Exact backup image digest `sha256:f285ea80c5e90c95429f5a17f524801e79c0e62f9962b37c89d0542a2aefaac4`
    required_secrets:
      - Existing HCP Terraform token for CLI access, if required
      - Existing HCP sensitive variable values (values must never enter Git or logs)

  outputs:
    files:
      - infra/terraform/azure-production/main.tf
      - infra/terraform/azure-production/variables.tf
      - infra/terraform/azure-production/.terraform.lock.hcl
      - .agent/status.yaml
      - .agent/tasks/azjob-001.yaml
      - .github/workflows/verify-backup-container-supply-chain.yml
      - scripts/backup-container-verification.test.mjs
      - docs/operations/container-supply-chain.md
      - docs/evidence/azjob-001/2026-10-07.md
      - PRODUCTION-CONTINUATION.md
    terraform_resources:
      - azapi_resource.jobs_environment
      - azurerm_container_app_job.backup
    database_changes: [none]
    deployed_units:
      - One Consumption-only Workload Profiles environment and one manual Container Apps Job; apply succeeded with owner approval, while job start remains a separate approval gate.

  compatibility:
    requires_expand_contract: false
    stable_version_compatible: true
    rollback_window: Remove only the new Workload Profiles environment and Job through a reviewed Terraform plan; preserve the Express environment, existing Container Instance, and all backup objects.

  validation:
    commands:
      - terraform providers lock for linux_amd64 and windows_amd64
      - terraform fmt -check -recursive infra/terraform
      - terraform validate in infra/terraform/azure-production
      - node --test scripts/backup-container-verification.test.mjs
      - Protected pull request checks
      - Exact-digest backup image verification workflow on protected main
      - HCP Terraform plan for `atmos-azure-production`
    expected:
      - HCP plan adds only `azapi_resource.jobs_environment` and `azurerm_container_app_job.backup`; no changes or destroys.
      - Job trigger is manual, parallelism is 1, retry limit is 0, and timeout is 1800 seconds.
      - Backup image is pinned to the verified immutable digest.
      - Secret values are redacted in plan output and never appear in Git or logs.
      - No job execution, schedule, or R2 write occurs as part of this task's plan or apply.

  security_checks:
    - Verify the exact backup image digest, source revision, signer workflow identity, and CycloneDX attestation before any apply.
    - Pin AzAPI and validate its HCP Azure OIDC authentication without adding an Azure client secret.
    - Reuse existing HCP-sensitive values; do not create, rotate, or print secret material.
    - Keep public GHCR anonymous and do not add registry credentials.
    - Do not add automatic retries or schedules that could multiply credit use or backup writes.
    - Stop if the plan contains changes or destroys beyond the two approved resources.

  budget_checks:
    worker_cpu_budget_ms: 7
    creates_paid_resource: true
    requires_student_credit: true
    approved_max_initial_credit_consumption_usd: 10
    bounded_single_execution:
      max_vcpu_seconds: 450
      max_gib_seconds: 900
      max_replicas: 1
      max_runtime_seconds: 1800
    cost_effect:
      current: The Express environment remains unchanged; the separate Consumption-only Workload Profiles environment and manual-only Job are provisioned with zero executions.
      proposed: Keep the Job manual-only. No dedicated profile, persisted logs, schedule, or retries are configured; each execution remains separately approved.
      free_tier_impact: The bounded run represents 450 vCPU-seconds and 900 GiB-seconds of the subscription's shared monthly Consumption grants. Usage beyond grants can consume student credit; the USD 10 budget alerts but does not cap spend.

  telemetry:
    metrics: [Azure Cost Management actual spend, remaining student credit, HCP run state]
    logs: [sanitized job ID, image digest, exit status; never log secrets or database URLs]
    traces: [HCP run ID, Git SHA, Azure job execution ID if owner-approved run occurs]

  evidence:
    - docs/evidence/azjob-001/2026-10-07.md

  rollback:
    strategy: Remove only the new AzAPI Workload Profiles environment and backup Job through a reviewed Terraform plan; preserve the existing Express environment, Container Instance, and all R2 backup objects.

  human_approval:
    required: true
    reason: On 2026-10-10 the owner reported USD 100 total Azure for Students credit with 12-month validity and explicitly approved applying the reviewed two-add plan, copying the four existing sensitive HCP values into Azure, and limiting initial consumption to USD 10. HCP run `run-6SFRZRJEtqUTy8HN` applied successfully. The owner did not approve job execution; starting the Job remains a separate approval gate.
