task:
  id: WEB-011
  title: Make activity planner windows actionable and explainable
  status: DONE
  objective: Show ranked activity windows as clear local-time ranges with progressive disclosure for the deterministic scoring factors.

  depends_on: [WEB-003, WEB-007, FEAT-PLAN-001, WX-004]

  external_policy_checks:
    [none; use existing hourly forecast values and deterministic planner scoring]

  runtime_placement:
    allowed: [vercel-nextjs]
    selected: vercel-nextjs
    reason: Planner scoring and display are client-side uses of already-loaded forecast data.

  scope:
    include:
      - apps/web/components/activity-planner.tsx
      - apps/web/app/globals.css
      - tests/e2e/dashboard.spec.ts
      - .agent/status.yaml
      - .agent/tasks/web-011.yaml
      - docs/architecture/atmos-devsecops-master-plan.md
      - docs/evidence/web-011/2026-10-11.md
    exclude:
      - Planner scoring changes or new activity/data dimensions
      - Additional weather requests or background evaluation
      - Persisted planner history or new provider data

  inputs:
    required_config: [existing normalized hourly dashboard forecast]
    required_secrets: []

  outputs:
    files:
      - apps/web/components/activity-planner.tsx
      - apps/web/app/globals.css
      - tests/e2e/dashboard.spec.ts
    terraform_resources: []
    database_changes: [none]
    deployed_units: [web]

  compatibility:
    requires_expand_contract: false
    stable_version_compatible: true
    rollback_window: Revert planner presentation changes; scoring and weather API contracts remain unchanged.

  validation:
    commands:
      - corepack pnpm exec vitest run packages/domain/src/index.test.ts
      - corepack pnpm typecheck
      - corepack pnpm lint
      - corepack pnpm exec playwright test tests/e2e/dashboard.spec.ts --workers=1
      - corepack pnpm --filter @atmos/web build
    expected:
      - Activity options retain the existing deterministic score and are exposed as clear title-cased controls.
      - Each ranked forecast window shows its local start/end time, date, score, and rank.
      - Scoring factors are available from a keyboard-accessible disclosure, labeled by dimension and positive/negative impact.
      - Changing activity recomputes from existing hourly data only; no weather endpoint is called.

  security_checks:
    - Render planner factors as text; do not insert HTML or log user activity.
    - Preserve existing deterministic scoring inputs and API limits.

  budget_checks:
    worker_cpu_budget_ms: 7
    creates_paid_resource: false
    requires_student_credit: false

  telemetry:
    metrics: [none added]
    logs: [none added]
    traces: [none added]

  evidence:
    - docs/evidence/web-011/2026-10-11.md
    - pull request checks

  rollback:
    strategy: Restore the current compact planner card and title labels; no server or scoring changes exist.

  human_approval:
    required: false
    reason: This is a client-only display change with no external calls, provider changes, or persisted data.
