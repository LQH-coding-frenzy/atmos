task:
  id: CVRET-001
  title: CV runtime retirement
  status: DONE
  objective: Retire unused queue, alert-delivery, and Azure container-platform runtime while preserving RLS and backup evidence.
  depends_on:
    [
      EDGE-001,
      ALERT-002,
      QUEUE-001,
      QUEUE-002,
      QUEUE-003,
      QUEUE-004,
      QUEUE-005,
      QUEUE-006,
      AZ-001,
      TF-002,
    ]
  external_policy_checks:
    - owner-approved Cloudflare queue deletion
    - owner-approved Azure destructive Terraform apply
  runtime_placement:
    allowed: [github-actions, cloudflare-worker, supabase-edge-function, azure-container-instance]
    selected: github-actions
    reason: Protected workflows coordinate exact releases and secret retirement without exposing credentials.
  scope:
    include:
      - workers/gateway
      - supabase/functions/api-v1
      - infra/terraform
      - .github/workflows/retire-cv-runtime.yml
    exclude:
      - database schema or RLS deletion
      - R2 backup archive deletion
      - paid resource creation
  inputs:
    required_config: [protected main, HCP Terraform workspaces, production custom API domain]
    required_secrets: [CLOUDFLARE_API_TOKEN, SUPABASE_ACCESS_TOKEN, TF_ORG_TOKEN]
  outputs:
    files: [docs/evidence/cvret-001]
    terraform_resources:
      - cloudflare_queue.notifications
      - cloudflare_queue.notifications_dlq
      - azurerm_container_app_environment.production
      - azurerm_log_analytics_workspace.production
    database_changes: [none]
    deployed_units: [queue-free Worker and Supabase function release]
  compatibility:
    requires_expand_contract: false
    stable_version_compatible: false
    rollback_window: expired; the approved destructive queue and Azure applies completed on 2026-09-22
  validation:
    commands:
      - corepack pnpm lint
      - corepack pnpm typecheck
      - corepack pnpm test
      - corepack pnpm test:db
      - corepack pnpm --filter @atmos/gateway build
      - terraform plan with only approved deletions
    expected:
      - public weather and dependency health remain available
      - no queue or alert-delivery runtime remains
      - RLS tests remain green
  security_checks: [gitleaks, codeql_or_semgrep, trivy, rls_tests]
  budget_checks:
    worker_cpu_budget_ms: 7
    creates_paid_resource: false
    requires_student_credit: false
  telemetry:
    metrics: [existing gateway health and weather synthetics]
    logs: [sanitized release and Terraform summaries]
    traces: [request_id and traceparent remain enabled]
  evidence: [docs/evidence/cvret-001]
  rollback:
    strategy: Redeploy the queue-free release; queue and Azure resource deletion are intentionally irreversible without a new approved provision.
  human_approval:
    required: true
    reason: Owner approved runtime retirement and destructive provider applies on 2026-09-20.
