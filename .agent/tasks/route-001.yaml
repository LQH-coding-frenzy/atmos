task:
  id: ROUTE-001
  title: Worker to versioned Supabase proxy
  status: REVIEW
  objective: Route public API traffic from the Worker to an explicitly configured versioned Supabase function.
  depends_on: [FUNC-001, EDGE-002]
  external_policy_checks: [none]
  runtime_placement:
    allowed: [cloudflare-worker]
    selected: cloudflare-worker
    reason: The Worker owns public routing and forwards database-adjacent requests to Supabase.
  scope:
    include:
      [
        .agent/status.yaml,
        .agent/tasks/route-001.yaml,
        docs/evidence/route-001/2026-09-04.md,
        workers/gateway/src/index.ts,
        workers/gateway/src/index.test.ts,
      ]
    exclude: [remote Worker deploy, remote function deploy, database access]
  validation:
    commands:
      [
        corepack pnpm exec vitest run workers/gateway/src/index.test.ts,
        corepack pnpm --filter @atmos/gateway build,
      ]
  evidence: [docs/evidence/route-001/2026-09-04.md, pull request checks]
