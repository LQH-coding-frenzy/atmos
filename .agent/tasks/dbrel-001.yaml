task:
  id: DBREL-001
  title: Expand and contract migration release
  status: DONE
  objective: Promote the two reviewed additive migrations to staging without impairing retained backend compatibility.
  depends_on: [DB-001]
  external_policy_checks: [scoped provider preflight GO, owner-approved staging migration apply]
  runtime_placement:
    allowed: [postgres]
    selected: postgres
    reason: Supabase migration history is the authoritative staging schema release boundary.
  scope:
    include:
      [
        .agent/status.yaml,
        .agent/tasks/dbrel-001.yaml,
        docs/operations/database-migrations.md,
        docs/evidence/dbrel-001,
        docs/evidence/preflight/2026-09-10.md,
        supabase/migrations/20260907000000_alert_events.sql,
        supabase/migrations/20260908000000_saved_locations.sql,
        atmos-staging migration history,
      ]
    exclude:
      [
        production database,
        destructive migration,
        migration rewrite,
        backup creation,
        backend deployment,
      ]
  inputs:
    required_config: [staging project ref btrvybyprlcumtovdxsc]
    required_secrets: [SUPABASE_ACCESS_TOKEN]
  outputs:
    files: [docs/evidence/dbrel-001/2026-09-10.md, docs/evidence/preflight/2026-09-10.md]
    terraform_resources: []
    database_changes: [20260907000000_alert_events.sql, 20260908000000_saved_locations.sql]
    deployed_units: [atmos-staging PostgreSQL]
  compatibility:
    requires_expand_contract: true
    stable_version_compatible: true
    rollback_window: retain additive tables through the backend release window
  validation:
    commands:
      [
        corepack pnpm exec supabase db reset,
        corepack pnpm test:db,
        corepack pnpm exec supabase db push --linked --dry-run,
        corepack pnpm exec supabase migration list --linked,
      ]
    expected:
      [
        107 local pgTAP assertions pass,
        dry-run lists exactly two migrations,
        remote history matches local after apply,
      ]
  security_checks: [rls_tests_if_applicable, protected database checks]
  budget_checks:
    worker_cpu_budget_ms: 7
    creates_paid_resource: false
    requires_student_credit: false
  telemetry:
    metrics: [remote migration history]
    logs: [Supabase CLI migration apply result]
    traces: [not applicable to schema release]
  evidence:
    [
      docs/evidence/dbrel-001/2026-09-10.md,
      dry-run output,
      post-apply migration list,
      protected database check,
    ]
  rollback:
    strategy: Retain the additive tables for stable compatibility and forward-fix defects with a new migration; do not destructively roll back staging data.
  human_approval:
    required: true
    reason: Owner approved both additive atmos-staging migrations on 2026-09-10.
