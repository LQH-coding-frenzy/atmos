task:
  id: REL-005
  title: Worker version affinity and request-header Transform Rule
  status: IN_PROGRESS
  objective: Keep browser requests in one Atmos session on the same Cloudflare Worker version during gradual deployments using a random session-only affinity key.
  depends_on: [REL-004]
  external_policy_checks:
    - Existing Cloudflare Free zone and active api.rainify.dpdns.org custom hostname; no new paid resource or vendor.
    - The http_request_late_transform entrypoint was not present at the owner-approved read-only preflight.
    - Avoid the Rules Language Matches operator because the HCP plan reports it requires a paid Business/WAF Advanced plan.
  runtime_placement:
    allowed: [cloudflare-worker, vercel-nextjs]
    selected: cloudflare-worker
    reason: Cloudflare Worker versions consume the platform affinity key; the Vercel client creates and sends a non-sensitive session key.
  scope:
    include:
      [
        apps/web/app/page.tsx,
        apps/web/next.config.ts,
        apps/web/next-config.test.ts,
        apps/web/lib/gateway-origin.ts,
        apps/web/lib/gateway-origin.test.ts,
        scripts/worker-affinity-smoke.mjs,
        scripts/worker-affinity-smoke.test.mjs,
        apps/web/lib/version-affinity.ts,
        apps/web/lib/version-affinity.test.ts,
        apps/web/components,
        workers/gateway/src/index.ts,
        workers/gateway/src/index.test.ts,
        infra/terraform/production-edge.tf,
        .github/workflows/vercel-production.yml,
        .github/workflows/rel-005-affinity-test.yml,
        .github/workflows/release-edge-runtime.yml,
        .github/workflows/worker-rollback.yml,
        docs/adr/0003-worker-version-affinity.md,
        docs/operations/production-worker-canary.md,
        PRODUCTION-CONTINUATION.md,
        .agent/status.yaml,
        .agent/tasks/rel-005.yaml,
        docs/evidence/rel-005,
      ]
    exclude:
      - authentication/authorization semantics
      - user IDs, emails, JWTs, cookies, or durable server-side affinity state
      - database/schema/RLS changes
      - paid Workers plans or new vendors
      - any rollout percentage change beyond the single owner-approved REL-005 test
  inputs:
    required_config:
      [
        production API hostname api.rainify.dpdns.org,
        CORS header X-Atmos-Version-Key,
        existing Grafana Cloud stack URL,
      ]
    required_secrets:
      [
        VERCEL_PROTECTION_BYPASS,
        VERCEL_TOKEN,
        CLOUDFLARE_API_TOKEN,
        SUPABASE_ACCESS_TOKEN,
        GRAFANA_SERVICE_ACCOUNT_TOKEN,
      ]
  outputs:
    files:
      [
        apps/web/app/page.tsx,
        apps/web/next.config.ts,
        apps/web/next-config.test.ts,
        apps/web/lib/gateway-origin.ts,
        apps/web/lib/gateway-origin.test.ts,
        scripts/worker-affinity-smoke.mjs,
        scripts/worker-affinity-smoke.test.mjs,
        apps/web/lib/version-affinity.ts,
        apps/web/lib/version-affinity.test.ts,
        apps/web/components,
        workers/gateway/src/index.ts,
        workers/gateway/src/index.test.ts,
        infra/terraform/production-edge.tf,
        .github/workflows/vercel-production.yml,
        .github/workflows/rel-005-affinity-test.yml,
        .github/workflows/release-edge-runtime.yml,
        .github/workflows/worker-rollback.yml,
        docs/adr/0003-worker-version-affinity.md,
        docs/operations/production-worker-canary.md,
        PRODUCTION-CONTINUATION.md,
        docs/evidence/rel-005/2026-09-30.md,
      ]
    terraform_resources: [cloudflare_ruleset.http_request_late_transform]
    database_changes: [none]
    deployed_units:
      [
        Vercel web API origin,
        Cloudflare Worker CORS,
        Cloudflare zone request-header transform rule,
        one-time temporary affinity test split,
      ]
  compatibility:
    requires_expand_contract: false
    stable_version_compatible: true
    rollback_window: The test workflow restores the captured stable version to 100 percent; feature rollback removes the transform rule and reverts the production API origin while preserving the custom hostname.
  validation:
    commands:
      [
        corepack pnpm exec vitest run apps/web/lib/version-affinity.test.ts apps/web/lib/gateway-origin.test.ts workers/gateway/src/index.test.ts apps/web/next-config.test.ts,
        node --test scripts/worker-affinity-smoke.test.mjs,
        corepack pnpm typecheck,
        corepack pnpm --filter @atmos/web build,
        corepack pnpm --filter @atmos/gateway build,
        terraform fmt -check and validate for infra/terraform,
        HCP Terraform speculative plan for atmos-edge-production,
        protected production rule and exact-host smoke,
        protected one-time 90/10 affinity verification during an owner-approved version split,
        WAE and Grafana synthetic gates plus automatic restoration to the original stable version at 100 percent,
      ]
    expected:
      - the same browser tab reuses a random UUIDv4 across gateway requests
      - production server rendering stays on the stable unkeyed hostname while browser requests use the custom affinity hostname
      - requests without a valid affinity key continue normally and are not treated as authenticated
      - CORS preflight permits X-Atmos-Version-Key only for the configured frontend origin
      - the zone rule maps a non-empty key on api.rainify.dpdns.org to Cloudflare-Workers-Version-Key; the client creates UUIDv4 values
      - repeated requests with the same key remain on the same Worker version during a split
      - the test is bounded, the stable release is restored at 100 percent, and final deployment inventory is verified
      - affinity keys are absent from application logs, analytics, and telemetry attributes
  security_checks: [gitleaks, codeql_or_semgrep, trivy_if_applicable]
  budget_checks:
    worker_cpu_budget_ms: 7
    creates_paid_resource: false
    requires_student_credit: false
  telemetry:
    metrics: [existing per-version WAE telemetry only]
    logs: [none; affinity key is not logged]
    traces: [existing traceparent propagation only]
  evidence:
    - docs/evidence/rel-005/2026-09-30.md
    - HCP speculative production plan
    - protected Cloudflare rule verification and affinity smoke
    - protected REL-005 affinity workflow run with WAE/Grafana decisions and final stable 100-percent inventory
    - protected Vercel exact-candidate and production smoke, plus sanitized browser same-key API smoke
  rollback:
    strategy: The protected affinity test always restores the captured stable Worker to 100 percent after the test. For feature rollback, remove only the version-key Transform Rule and revert frontend API-origin/CORS changes; preserve the existing custom hostname and Worker deployment history.
  human_approval:
    required: true
    reason: Owner explicitly approved the REL-005 Cloudflare/API-origin changes, the Vercel deployment-protection bypass secret, and Vercel production validation on 2026-09-30 and 2026-10-01. On 2026-10-02 the owner separately approved one protected 90/10 affinity test, automatic restoration to the captured stable version at 100 percent, and storage of the existing Grafana service token in the GitHub Production environment. This does not authorize an ongoing rollout or any other percentage split.
