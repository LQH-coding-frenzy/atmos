task:
  id: FEAT-GEO-001
  title: User-controlled browser geolocation
  status: DONE
  objective: Let a user explicitly request local weather from the device's current coordinates without persisting or exposing them in the page URL.
  depends_on: [EDGE-004, WEB-002, WX-004]
  external_policy_checks: [none; uses browser permission and the existing public weather gateway]
  runtime_placement:
    allowed: [vercel-nextjs]
    selected: vercel-nextjs
    reason: Browser permission must be requested directly from the user and the existing gateway already serves coordinate-based weather.
  scope:
    include:
      [
        .agent/status.yaml,
        .agent/tasks/feat-geo-001.yaml,
        apps/web/app/globals.css,
        apps/web/components/dashboard.tsx,
        tests/e2e/dashboard.spec.ts,
        docs/architecture/atmos-devsecops-master-plan.md,
        docs/evidence/feat-geo-001/2026-09-27.md,
      ]
    exclude:
      [
        background location,
        coordinate persistence,
        geolocation in page URL,
        saved-location API,
        database or provider changes,
      ]
  inputs:
    required_config: []
    required_secrets: []
  outputs:
    files: [apps/web/components/dashboard.tsx, tests/e2e/dashboard.spec.ts]
    terraform_resources: []
    database_changes: [none]
    deployed_units: [web]
  compatibility:
    requires_expand_contract: false
    stable_version_compatible: true
    rollback_window: until the previous Vercel deployment is retired
  validation:
    commands:
      [
        corepack pnpm exec playwright test tests/e2e/dashboard.spec.ts,
        corepack pnpm --filter @atmos/web build,
        corepack pnpm typecheck,
      ]
    expected:
      [
        geolocation is user-triggered and permission failures are accessible,
        web build and typecheck succeed,
      ]
  security_checks: [gitleaks, codeql_or_semgrep, trivy_if_applicable]
  budget_checks:
    worker_cpu_budget_ms: 7
    creates_paid_resource: false
    requires_student_credit: false
  telemetry:
    metrics: ['none; no location telemetry is collected']
    logs: ['none; coordinates are not logged or persisted']
    traces: ['none; browser uses the existing weather request path']
  evidence: [docs/evidence/feat-geo-001/2026-09-27.md, pull request checks]
  rollback:
    strategy: Revert the dashboard control and geolocation browser flow; no external state exists.
  human_approval:
    required: false
    reason: Explicitly user-triggered frontend feature using the existing public gateway and no persisted personal data.
