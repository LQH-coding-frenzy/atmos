task:
  id: ALERT-INAPP-001
  title: Authenticated in-app weather alert rules
  status: IN_PROGRESS
  objective: Let signed-in users create, pause, and delete in-app-only threshold rules and see their current match state against the open dashboard weather.
  depends_on: [ALERT-001, ALERT-002, DOM-002, FEAT-LOC-UI-001, FUNC-002, ROUTE-001, WEB-002]
  external_policy_checks:
    [
      Existing NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY are required in Vercel Production; owner reports configuration is updated and the protected release must verify it.,
    ]
  runtime_placement:
    allowed: [supabase-edge-function, vercel-nextjs]
    selected: supabase-edge-function
    reason: The existing authenticated Edge API provides caller-scoped RLS rule CRUD; the in-app evaluator stays with the dashboard and introduces no Worker compute or background schedule.
  scope:
    include:
      [
        .agent/status.yaml,
        .agent/tasks/alert-inapp-001.yaml,
        packages/contracts/src/index.ts,
        packages/contracts/src/index.test.ts,
        packages/domain/src/index.ts,
        packages/domain/src/index.test.ts,
        supabase/functions/_shared/alert-rules.ts,
        supabase/functions/_shared/alert-rules.test.ts,
        supabase/functions/api-v1/index.ts,
        workers/gateway/src/index.ts,
        workers/gateway/src/index.test.ts,
        apps/web/components/in-app-alerts-panel.tsx,
        apps/web/components/dashboard.tsx,
        apps/web/app/globals.css,
        tests/e2e/dashboard.spec.ts,
        README.md,
        docs/operations/cv-showcase-maintenance.md,
        docs/architecture/atmos-devsecops-master-plan.md,
        docs/evidence/alert-inapp-001/2026-09-27.md,
      ]
    exclude:
      [
        email/push delivery,
        queue reactivation,
        cron/scheduling services,
        alert_events writes,
        schema/RLS migrations,
        external alert vendor,
      ]
  inputs:
    required_config: [NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY]
    required_secrets: []
  outputs:
    files: [supabase/functions/api-v1/index.ts, apps/web/components/in-app-alerts-panel.tsx]
    terraform_resources: []
    database_changes: [none; uses existing alert_rules schema and RLS]
    deployed_units: [api-v1 Edge Function, queue-free Worker, web]
  compatibility:
    requires_expand_contract: false
    stable_version_compatible: true
    rollback_window: until previous Edge Function, Worker, and Vercel releases are retired
  validation:
    commands:
      [
        corepack pnpm exec vitest run supabase/functions/_shared/alert-rules.test.ts packages/domain/src/index.test.ts packages/contracts/src/index.test.ts,
        corepack pnpm exec playwright test tests/e2e/dashboard.spec.ts,
        corepack pnpm typecheck,
        corepack pnpm test:db,
        corepack pnpm --filter @atmos/domain build,
        corepack pnpm --filter @atmos/gateway build,
        corepack pnpm --filter @atmos/web build,
      ]
    expected:
      [
        Authenticated rule CRUD is RLS-scoped; in-app status evaluates supported current/forecast conditions; no notification or scheduled delivery occurs.,
      ]
  security_checks: [gitleaks, codeql_or_semgrep, trivy_if_applicable, existing RLS tests]
  budget_checks:
    worker_cpu_budget_ms: 7
    creates_paid_resource: false
    requires_student_credit: false
  telemetry:
    metrics: ['existing bounded api_proxy route group only; no condition values or rule payloads']
    logs: ['request IDs and sanitized errors only; no rule thresholds or user data']
    traces: ['existing request correlation only']
  evidence:
    [
      docs/evidence/alert-inapp-001/2026-09-27.md,
      pull request checks,
      protected Edge and Vercel releases,
    ]
  rollback:
    strategy: Revert the API and in-app panel; retain existing user alert rules and RLS data, and leave queues/cron retired.
  human_approval:
    required: true
    reason: Owner updated the existing public Supabase client configuration in Vercel Production; no value is read from or written to repository files.
