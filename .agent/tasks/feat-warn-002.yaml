task:
  id: FEAT-WARN-002
  title: Integrate approved NWS and ECCC warning feeds
  status: REVIEW
  objective: Add an on-demand official warning center for U.S. NWS and Canadian ECCC service areas, with source/coverage disclosure and explicit unsupported regions.
  depends_on: [FEAT-WARN-001, EDGE-004, CACHE-001, PERF-001, WX-004, WEB-012]
  external_policy_checks:
    [
      owner approved NWS + ECCC sources for US service areas and Canada on 2026-10-19; NWS User-Agent required and alert route cached for 60 seconds,
      NWS API/Alerts documentation and ECCC GeoMet OGC API docs rechecked 2026-10-19; ECCC licence v2.1.1 attribution and no-content/intent-alteration terms retained,
      ECCC usage policy rechecked 2026-10-19: meaningful User-Agent,
      no no-cache request headers,
      avoid excess request volume,
      staging warning route p95 measured 9.196 ms on 2026-10-19,
      above the 7 ms Worker gate; owner approved moving the route to the existing Vercel Next.js runtime on 2026-10-20,
      official NWS OpenAPI schema confirmed /alerts/active has no limit parameter; removed before validating the Next.js server route,
    ]
  runtime_placement:
    allowed: [cloudflare-worker, vercel-nextjs]
    selected: vercel-nextjs
    reason: The staging Worker warning route measured 9.196 ms CPU p95, above the internal 7 ms gate. Owner approved moving provider requests/normalization to the existing Next.js server runtime; keep upstream data cached and never expose provider responses or credentials in the browser.
  scope:
    include:
      [
        packages/contracts/src/index.ts,
        packages/contracts/src/index.test.ts,
        apps/web/components/severe-weather-panel.tsx,
        apps/web/app/api/v1/weather/warnings/route.ts,
        apps/web/app/api/v1/weather/warnings/route.test.ts,
        apps/web/lib/official-warnings.ts,
        apps/web/lib/official-warnings.test.ts,
        apps/web/components/dashboard.tsx,
        apps/web/app/globals.css,
        tests/e2e/dashboard.spec.ts,
        tests/e2e/severe-weather.spec.ts,
        .agent,
        docs/design/feature-completion-roadmap.md,
        docs/design/provenance.md,
        docs/evidence/feat-warn-002,
      ]
    exclude:
      [
        paid warning provider,
        credentials/API keys,
        regions without verified official source coverage,
        WMO SWIC page scraping,
        automatic alerts/notifications,
        database persistence,
        production release,
      ]
  inputs:
    required_config: []
    required_secrets: []
  outputs:
    files:
      [
        apps/web/app/api/v1/weather/warnings/route.ts,
        apps/web/lib/official-warnings.ts,
        apps/web/components/severe-weather-panel.tsx,
        tests/e2e/severe-weather.spec.ts,
      ]
    terraform_resources: []
    database_changes: [none]
    deployed_units:
      [isolated atmos-gateway-staging with warning route removed; no Vercel or production release]
  compatibility:
    requires_expand_contract: false
    stable_version_compatible: true
    rollback_window: Remove the warning route/panel; current dashboard/weather API remains unchanged.
  validation:
    commands:
      [
        corepack pnpm exec vitest run apps/web/lib/official-warnings.test.ts apps/web/app/api/v1/weather/warnings/route.test.ts packages/contracts/src/index.test.ts,
        corepack pnpm exec playwright test tests/e2e/severe-weather.spec.ts tests/e2e/dashboard.spec.ts --workers=1,
        corepack pnpm --filter @atmos/web build,
        corepack pnpm typecheck,
      ]
    expected:
      [
        NWS/ECCC errors are sanitized,
        providers are queried only for supported country coverage and on user action,
        warnings keep original source text/intent/times/areas,
        unsupported geography is distinct from no active warning,
        warning route is served by the existing Vercel Next.js server runtime,
        not the Worker,
        upstream requests use the Next.js data cache,
        bounded bodies,
        and sanitized errors,
        NWS/ECCC provider requests remain server-only and occur only after the panel is opened,
      ]
  security_checks:
    [
      bounded coordinates and upstream responses,
      server-side requests only,
      sanitized errors,
      no secrets or personal data in logs,
    ]
  budget_checks:
    worker_cpu_budget_ms: 7
    creates_paid_resource: false
    requires_student_credit: false
  telemetry:
    metrics: [existing Vercel server telemetry only; no coordinates or alert text]
    logs: [sanitized route/provider outcome only; no request-body location data]
    traces: [existing request correlation]
  evidence:
    [
      docs/evidence/feat-warn-002/implementation.md,
      Worker CPU p95 failure measurement and runtime-placement decision,
      official coverage and attribution screenshots,
    ]
  rollback:
    strategy: Remove the warning route and panel; no schema or durable state is introduced.
  human_approval:
    required: true
    reason: Owner approved NWS for U.S. service areas and ECCC for Canada on 2026-10-19, authorized an isolated staging CPU check after preflight, and approved moving the route to Vercel Next.js on 2026-10-20. Production release remains separately gated.
