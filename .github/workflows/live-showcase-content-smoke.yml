name: Live showcase content smoke

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-showcase-content-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify live dashboard content
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --dump-header "$RUNNER_TEMP/headers" \
            --output "$RUNNER_TEMP/dashboard.html" --write-out '%{http_code}' \
            "https://rainify.dpdns.org/")"
          node scripts/verify-frontend-response.mjs "$status" "$RUNNER_TEMP/headers" "$RUNNER_TEMP/dashboard.html"
