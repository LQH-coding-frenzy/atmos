name: Bootstrap Backup Secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      TF_ORG_TOKEN: ${{ secrets.TF_ORG_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Create least-privilege backup role
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 32)"
          key="$(openssl rand -hex 32)"
          export BACKUP_PASSWORD="$password"
          export BACKUP_ENCRYPTION_KEY="$key"
          sql="DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'atmos_backup') THEN CREATE ROLE atmos_backup LOGIN PASSWORD '$password'; ELSE ALTER ROLE atmos_backup LOGIN PASSWORD '$password'; END IF; END \$\$; GRANT CONNECT ON DATABASE postgres TO atmos_backup; GRANT USAGE ON SCHEMA public TO atmos_backup; GRANT SELECT ON ALL TABLES IN SCHEMA public TO atmos_backup; GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO atmos_backup;"
          error_file="$(mktemp)"
          if ! npx --yes supabase@2.116.0 db query --linked --project-ref oxgwprvkotfvyacpqayx "$sql" --output-format json >"$error_file" 2>&1; then
            sed -E 's/[[:xdigit:]]{64}/[REDACTED]/g' "$error_file"
            exit 1
          fi
          node --input-type=module -e '
            const password = process.env.BACKUP_PASSWORD;
            const key = process.env.BACKUP_ENCRYPTION_KEY;
            const headers = { Authorization: `Bearer ${process.env.TF_ORG_TOKEN}`, Accept: "application/vnd.api+json", "Content-Type": "application/vnd.api+json" };
            const workspace = await fetch("https://app.terraform.io/api/v2/organizations/atmos_uit/workspaces/atmos-azure-production", { headers });
            if (!workspace.ok) throw new Error(`workspace request failed: ${workspace.status}`);
            const workspaceId = (await workspace.json()).data.id;
            const existing = await fetch(`https://app.terraform.io/api/v2/workspaces/${workspaceId}/vars`, { headers });
            if (!existing.ok) throw new Error(`variable list failed: ${existing.status}`);
            const byKey = new Map((await existing.json()).data.map((item) => [item.attributes.key, item.id]));
            const values = new Map([
              ["backup_database_url", `postgresql://atmos_backup:${password}@db.oxgwprvkotfvyacpqayx.supabase.co:5432/postgres?sslmode=require`],
              ["backup_encryption_key", key],
            ]);
            for (const [key, value] of values) {
              const id = byKey.get(key);
              const response = await fetch(id ? `https://app.terraform.io/api/v2/vars/${id}` : `https://app.terraform.io/api/v2/workspaces/${workspaceId}/vars`, { method: id ? "PATCH" : "POST", headers, body: JSON.stringify({ data: { type: "vars", ...(id ? { id } : {}), attributes: { key, value, category: "terraform", sensitive: true } } }) });
              if (!response.ok) throw new Error(`HCP variable write failed: ${response.status}`);
            }
          '
