name: Browser smoke tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.1
      - name: Enable Corepack and install
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Install Chromium
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          pnpm exec playwright install --with-deps chromium
      - name: Run browser smoke tests
        env:
          # Keep browser UI coverage independent of GitHub-hosted custom-domain DNS.
          ATMOS_GATEWAY_URL: https://atmos-gateway.rainify.workers.dev
        run: pnpm test:e2e
