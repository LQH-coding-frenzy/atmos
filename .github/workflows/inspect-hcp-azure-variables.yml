name: Inspect HCP Azure Variables

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TF_ORG_TOKEN: ${{ secrets.TF_ORG_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: List Azure workspace variable metadata only
        run: |
          node --input-type=module -e '
            const headers = { Authorization: `Bearer ${process.env.TF_ORG_TOKEN}`, Accept: "application/vnd.api+json" };
            const workspace = await fetch("https://app.terraform.io/api/v2/organizations/atmos_uit/workspaces/atmos-azure-production", { headers });
            if (!workspace.ok) throw new Error(`workspace metadata request failed: ${workspace.status}`);
            const id = (await workspace.json()).data.id;
            const variables = await fetch(`https://app.terraform.io/api/v2/workspaces/${id}/vars`, { headers });
            if (!variables.ok) throw new Error(`workspace variable request failed: ${variables.status}`);
            for (const variable of (await variables.json()).data) {
              const { key, category, sensitive, value } = variable.attributes;
              if (["TFC_AZURE_PROVIDER_AUTH", "TFC_AZURE_RUN_CLIENT_ID", "TFC_AZURE_TENANT_ID", "TFC_AZURE_SUBSCRIPTION_ID", "subscription_id", "tenant_id", "client_id"].includes(key)) console.log(JSON.stringify({ key, category, sensitive, valuePresent: typeof value === "string" && value.length > 0, valueLength: typeof value === "string" ? value.length : 0 }));
            }
          '
