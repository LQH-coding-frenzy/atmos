name: Setup Ephemeral Restore Project

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      TF_ORG_TOKEN: ${{ secrets.TF_ORG_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Create temporary restore project and HCP handoff
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 32)"
          production="$(curl --fail --silent --show-error --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/oxgwprvkotfvyacpqayx")"
          org_id="$(node --input-type=module -e 'const project = JSON.parse(process.argv[1]); const id = project.organization_id; if (!id) throw new Error("production project organization ID unavailable"); console.log(id);' "$production")"
          project="$(npx --yes supabase@2.117.0 projects create "atmos-restore-${GITHUB_RUN_ID}" --org-id "$org_id" --db-password "$password" --region ap-southeast-1 --size micro --output json)"
          ref="$(node --input-type=module -e 'const project = JSON.parse(process.argv[1]); const ref = project.ref ?? project.id; if (!/^[a-z0-9]{20}$/.test(ref ?? "")) throw new Error("unexpected project reference"); console.log(ref);' "$project")"
          export RESTORE_DATABASE_URL="postgresql://postgres.${ref}:${password}@aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require"
          export RESTORE_PROJECT_REF="$ref"
          node --input-type=module -e '
            const headers = { Authorization: `Bearer ${process.env.TF_ORG_TOKEN}`, Accept: "application/vnd.api+json", "Content-Type": "application/vnd.api+json" };
            const workspace = await fetch("https://app.terraform.io/api/v2/organizations/atmos_uit/workspaces/atmos-azure-production", { headers });
            if (!workspace.ok) throw new Error(`workspace request failed: ${workspace.status}`);
            const workspaceId = (await workspace.json()).data.id;
            const existing = await fetch(`https://app.terraform.io/api/v2/workspaces/${workspaceId}/vars`, { headers });
            if (!existing.ok) throw new Error(`variable list failed: ${existing.status}`);
            const byKey = new Map((await existing.json()).data.map((item) => [item.attributes.key, item.id]));
            const key = "restore_database_url";
            const id = byKey.get(key);
            const response = await fetch(id ? `https://app.terraform.io/api/v2/vars/${id}` : `https://app.terraform.io/api/v2/workspaces/${workspaceId}/vars`, { method: id ? "PATCH" : "POST", headers, body: JSON.stringify({ data: { type: "vars", ...(id ? { id } : {}), attributes: { key, value: process.env.RESTORE_DATABASE_URL, category: "terraform", sensitive: true } } }) });
            if (!response.ok) throw new Error(`HCP restore URL write failed: ${response.status}`);
          '
          echo "::notice title=Temporary Supabase restore project::${RESTORE_PROJECT_REF}"
