name: Retire CV Runtime Components

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RETIRE_CV_RUNTIME to deploy the queue-free release and remove retired secrets
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: retire-cv-runtime
  cancel-in-progress: false

jobs:
  retire:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: Production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: oxgwprvkotfvyacpqayx
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Require explicit retirement confirmation
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "RETIRE_CV_RUNTIME"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$SUPABASE_ACCESS_TOKEN"
      - name: Check out protected source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1
      - name: Enable Corepack and install locked dependencies
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Build the queue-free Worker
        run: pnpm --filter @atmos/gateway build
      - name: Deploy the queue-free Supabase candidate
        id: backend
        run: |
          set -euo pipefail
          release_id="${GITHUB_SHA::12}"
          function_name="$(pnpm release:supabase:stage)"
          pnpm exec supabase functions deploy "$function_name" --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          function_url="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/$function_name"
          curl --fail --silent --show-error "$function_url/health" | jq --exit-status '.status == "ok"' >/dev/null
          curl --fail --silent --show-error "$function_url/version" | jq --exit-status --arg release "$release_id" '.release == $release' >/dev/null
          printf 'release_id=%s\nfunction_name=%s\nfunction_url=%s\n' "$release_id" "$function_name" "$function_url" >> "$GITHUB_OUTPUT"
      - name: Upload and deploy the queue-free Worker
        id: worker
        env:
          RELEASE_ID: ${{ steps.backend.outputs.release_id }}
          FUNCTION_URL: ${{ steps.backend.outputs.function_url }}
        run: |
          set -euo pipefail
          secrets_file="$RUNNER_TEMP/worker-secrets.env"
          umask 077
          printf 'SUPABASE_FUNCTION_URL=%s\n' "$FUNCTION_URL" > "$secrets_file"
          pnpm --filter @atmos/gateway exec wrangler versions upload --env="" --tag "$RELEASE_ID" --message "CVRET-001 queue-free runtime" --secrets-file "$secrets_file"
          pnpm --filter @atmos/gateway exec wrangler versions list --env="" --json > "$RUNNER_TEMP/versions.json"
          version_id="$(RELEASE_ID="$RELEASE_ID" node -e "const versions=require(process.argv[1]);const version=versions.find((item)=>item.annotations?.['workers/tag']===process.env.RELEASE_ID);if(!/^[0-9a-f-]{36}$/.test(version?.id??''))process.exit(1);process.stdout.write(version.id)" "$RUNNER_TEMP/versions.json")"
          pnpm --filter @atmos/gateway exec wrangler deployments list --env="" --json > "$RUNNER_TEMP/deployments.json"
          stable_version_id="$(node -e "const deployments=require(process.argv[1]);const current=[...deployments].sort((left,right)=>Date.parse(right.created_on)-Date.parse(left.created_on))[0];const stable=current?.versions?.find((version)=>version.percentage===100);if(!/^[0-9a-f-]{36}$/.test(stable?.version_id??''))process.exit(1);process.stdout.write(stable.version_id)" "$RUNNER_TEMP/deployments.json")"
          pnpm --filter @atmos/gateway exec wrangler versions deploy "$stable_version_id@100" "$version_id@0" --env="" --message "CVRET-001 queue-free candidate" --yes
          node scripts/worker-rollback.mjs smoke https://api.rainify.dpdns.org/ "$RELEASE_ID" "$version_id"
          pnpm --filter @atmos/gateway exec wrangler versions deploy "$version_id@100" --env="" --message "CVRET-001 queue-free release" --yes
          pnpm --filter @atmos/gateway exec wrangler triggers deploy --env=""
          node scripts/worker-rollback.mjs smoke https://api.rainify.dpdns.org/ "$RELEASE_ID"
          printf 'version_id=%s\n' "$version_id" >> "$GITHUB_OUTPUT"
      - name: Update canonical Supabase API after queue triggers are detached
        run: |
          set -euo pipefail
          pnpm exec supabase functions deploy api-v1 --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          curl --fail --silent --show-error "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/api-v1/health" | jq --exit-status '.status == "ok"' >/dev/null
      - name: Remove retired Cloudflare and Supabase secrets
        run: |
          set -euo pipefail
          worker_secrets="$(pnpm --filter @atmos/gateway exec wrangler secret list --env="" --format json)"
          if node -e "const secrets=JSON.parse(require('fs').readFileSync(0,'utf8'));process.exit(Array.isArray(secrets)&&secrets.some((secret)=>secret.name==='INTERNAL_QUEUE_SECRET')?0:1)" <<<"$worker_secrets"; then
            pnpm --filter @atmos/gateway exec wrangler secret delete INTERNAL_QUEUE_SECRET --env=""
          else
            echo 'Cloudflare queue secret is already absent.'
          fi
          pnpm exec supabase secrets unset INTERNAL_QUEUE_SECRET ALERT_CRON_SECRET GATEWAY_URL --project-ref "$SUPABASE_PROJECT_REF"
      - name: Delete staging queues
        run: |
          set -euo pipefail
          queues="$(pnpm --filter @atmos/gateway exec wrangler queues list --env='')"
          for queue in atmos-notifications-staging atmos-notifications-staging-dlq; do
            if [[ "$queues" == *"$queue"* ]]; then
              pnpm --filter @atmos/gateway exec wrangler queues delete "$queue" --env=""
            else
              echo "Queue $queue is already absent."
            fi
          done
      - name: Record retirement summary
        env:
          RELEASE_ID: ${{ steps.backend.outputs.release_id }}
          FUNCTION_NAME: ${{ steps.backend.outputs.function_name }}
          WORKER_VERSION_ID: ${{ steps.worker.outputs.version_id }}
        run: |
          {
            echo '## CV runtime retirement'
            echo
            echo "- Release: \`$RELEASE_ID\`"
            echo "- Supabase function: \`$FUNCTION_NAME\`"
            echo "- Worker version: \`$WORKER_VERSION_ID\`"
            echo '- Removed retired queue secrets and staging queues.'
            echo '- Production queue deletion remains owned by the reviewed Terraform apply.'
          } >> "$GITHUB_STEP_SUMMARY"
