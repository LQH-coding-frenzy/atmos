name: Vercel production release

on:
  workflow_dispatch:
    inputs:
      promote:
        description: Promote the smoke-tested deployment to the production domain
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: Production
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Require protected main
        run: test "$GITHUB_REF" = "refs/heads/main"
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1
      - name: Enable Corepack
        run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate release configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$VERCEL_SCOPE"
          test "$PRODUCTION_URL" = "https://rainify.dpdns.org"
      - name: Pull production settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          pnpm dlx vercel@59.15.1 pull --yes --environment=production
          --token "$VERCEL_TOKEN" --scope "$VERCEL_SCOPE"
      - name: Build production artifact once
        run: pnpm dlx vercel@59.15.1 build --prod
      - name: Capture current production deployment
        id: previous
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          pnpm dlx vercel@59.15.1 inspect "$PRODUCTION_URL" --json \
            --token "$VERCEL_TOKEN" --scope "$VERCEL_SCOPE" > "$RUNNER_TEMP/previous.json"
          previous_url="$(node -e "const value=require(process.argv[1]); const raw=value.url; if(typeof raw !== 'string') process.exit(1); const url=new URL(raw.startsWith('https://')?raw:'https://'+raw); if(!url.hostname.endsWith('.vercel.app')) process.exit(1); process.stdout.write(url.origin);" "$RUNNER_TEMP/previous.json")"
          printf 'url=%s\n' "$previous_url" >> "$GITHUB_OUTPUT"
      - name: Upload unaliased production artifact
        id: candidate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment_url="$(pnpm dlx vercel@59.15.1 deploy --prebuilt --prod --skip-domain --yes --no-color \
            --meta "release=$GITHUB_SHA" --token "$VERCEL_TOKEN" --scope "$VERCEL_SCOPE")"
          node -e "const url=new URL(process.argv[1]); if(url.protocol !== 'https:' || !url.hostname.endsWith('.vercel.app') || url.pathname !== '/') process.exit(1);" "$deployment_url"
          printf 'url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"
      - name: Smoke exact deployment
        env:
          DEPLOYMENT_URL: ${{ steps.candidate.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          status="$(pnpm dlx vercel@59.15.1 --token "$VERCEL_TOKEN" --scope "$VERCEL_SCOPE" \
            curl / --deployment "$DEPLOYMENT_URL" -- \
            --silent --show-error --dump-header "$RUNNER_TEMP/candidate-headers" \
            --output /dev/null --write-out '%{http_code}')"
          node scripts/verify-frontend-response.mjs "$status" "$RUNNER_TEMP/candidate-headers"
      - name: Promote exact deployment
        if: ${{ inputs.promote }}
        id: promote
        env:
          DEPLOYMENT_URL: ${{ steps.candidate.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          pnpm dlx vercel@59.15.1 promote "$DEPLOYMENT_URL" --yes
          --token "$VERCEL_TOKEN" --scope "$VERCEL_SCOPE"
      - name: Smoke production domain
        if: ${{ inputs.promote }}
        run: |
          status="$(curl --silent --show-error --dump-header "$RUNNER_TEMP/production-headers" \
            --output /dev/null --write-out '%{http_code}' "$PRODUCTION_URL")"
          node scripts/verify-frontend-response.mjs "$status" "$RUNNER_TEMP/production-headers"
      - name: Restore previous production deployment on failure
        if: ${{ failure() && inputs.promote && steps.promote.outcome == 'success' }}
        env:
          PREVIOUS_URL: ${{ steps.previous.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          pnpm dlx vercel@59.15.1 rollback "$PREVIOUS_URL" --yes
          --token "$VERCEL_TOKEN" --scope "$VERCEL_SCOPE"
      - name: Record release summary
        if: ${{ always() }}
        env:
          DEPLOYMENT_URL: ${{ steps.candidate.outputs.url }}
          PREVIOUS_URL: ${{ steps.previous.outputs.url }}
        run: |
          {
            printf '## Vercel production release\n\n'
            printf -- '- Git SHA: `%s`\n' "$GITHUB_SHA"
            printf -- '- Candidate: `%s`\n' "${DEPLOYMENT_URL:-not-created}"
            printf -- '- Previous: `%s`\n' "${PREVIOUS_URL:-not-captured}"
            printf -- '- Promotion requested: `%s`\n' "${{ inputs.promote }}"
          } >> "$GITHUB_STEP_SUMMARY"
