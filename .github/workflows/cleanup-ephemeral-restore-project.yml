name: Cleanup Ephemeral Restore Project

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Temporary Supabase project reference
        required: true
        type: string
      confirmation:
        description: Type DELETE_EPHEMERAL_RESTORE_PROJECT to confirm deletion
        required: true
        type: string

permissions:
  contents: read

jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: Production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ALL_ACCESS }}
      TF_ORG_TOKEN: ${{ secrets.TF_ORG_TOKEN }}
      PRODUCTION_PROJECT_REF: oxgwprvkotfvyacpqayx
      PROJECT_REF: ${{ inputs.project_ref }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify temporary project handoff
        shell: bash
        run: |
          set -euo pipefail
          ref="$PROJECT_REF"
          test "$CONFIRMATION" = "DELETE_EPHEMERAL_RESTORE_PROJECT"
          [[ "$ref" =~ ^[a-z0-9]{20}$ ]]
          test "$ref" != "$PRODUCTION_PROJECT_REF"
          node --input-type=module -e '
            const headers = { Authorization: `Bearer ${process.env.TF_ORG_TOKEN}`, Accept: "application/vnd.api+json", "Content-Type": "application/vnd.api+json" };
            const projectRef = process.env.PROJECT_REF;
            const workspace = await fetch("https://app.terraform.io/api/v2/organizations/atmos_uit/workspaces/atmos-azure-production", { headers });
            if (!workspace.ok) throw new Error(`workspace request failed: ${workspace.status}`);
            const workspaceId = (await workspace.json()).data.id;
            const variables = await fetch(`https://app.terraform.io/api/v2/workspaces/${workspaceId}/vars`, { headers });
            if (!variables.ok) throw new Error(`variable list failed: ${variables.status}`);
            const variable = (await variables.json()).data.find((item) => item.attributes.key === "restore_database_url");
            if (!variable) throw new Error("restore handoff is absent");
            const target = new URL(variable.attributes.value);
            if (!decodeURIComponent(target.username).endsWith(`.${projectRef}`)) throw new Error("restore handoff does not match the requested project");
          '
      - name: Delete verified temporary project and HCP handoff
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.117.0 projects delete "$PROJECT_REF" --yes
          node --input-type=module -e '
            const headers = { Authorization: `Bearer ${process.env.TF_ORG_TOKEN}`, Accept: "application/vnd.api+json", "Content-Type": "application/vnd.api+json" };
            const workspace = await fetch("https://app.terraform.io/api/v2/organizations/atmos_uit/workspaces/atmos-azure-production", { headers });
            if (!workspace.ok) throw new Error(`workspace request failed: ${workspace.status}`);
            const workspaceId = (await workspace.json()).data.id;
            const variables = await fetch(`https://app.terraform.io/api/v2/workspaces/${workspaceId}/vars`, { headers });
            if (!variables.ok) throw new Error(`variable list failed: ${variables.status}`);
            const variable = (await variables.json()).data.find((item) => item.attributes.key === "restore_database_url");
            if (!variable) throw new Error("restore handoff is absent");
            const response = await fetch(`https://app.terraform.io/api/v2/vars/${variable.id}`, { method: "DELETE", headers });
            if (!response.ok) throw new Error(`HCP restore URL deletion failed: ${response.status}`);
          '
