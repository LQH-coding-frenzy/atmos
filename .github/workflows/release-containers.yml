name: Container release

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release-containers.yml
      - jobs/**
      - scripts/ghcr-publish.test.mjs
  push:
    branches: [main]
    paths:
      - .github/workflows/release-containers.yml
      - jobs/**
      - scripts/ghcr-publish.test.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atmos-container-release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/atmos-jobs

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build bootstrap image without registry access
        run: >-
          docker build
          --build-arg SOURCE_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          --build-arg REVISION="$GITHUB_SHA"
          --tag atmos-jobs:validation
          jobs/container-bootstrap
      - name: Verify OCI identity labels
        run: |
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' atmos-jobs:validation)" = "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' atmos-jobs:validation)" = "$GITHUB_SHA"

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Log in with the ephemeral workflow token
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Define immutable image metadata
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: type=sha,format=long,prefix=sha-
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
      - name: Reject an existing immutable tag
        env:
          IMAGE_TAG: ${{ steps.metadata.outputs.tags }}
        run: |
          [[ "$IMAGE_TAG" != *$'\n'* ]]
          [[ "$IMAGE_TAG" == *":sha-$GITHUB_SHA" ]]
          if docker buildx imagetools inspect "$IMAGE_TAG" >/dev/null 2>&1; then
            echo 'The immutable Git SHA tag already exists; refusing to overwrite it.' >&2
            exit 1
          fi
      - name: Build and publish exact Git revision
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: jobs/container-bootstrap
          push: true
          provenance: false
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            REVISION=${{ github.sha }}
      - name: Verify exact published digest
        env:
          IMAGE_TAG: ${{ steps.metadata.outputs.tags }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "$IMAGE_TAG@$DIGEST" >/dev/null
          {
            echo '### Published OCI image'
            echo
            echo "- Image: \`$IMAGE_TAG\`"
            echo "- Digest: \`$DIGEST\`"
            echo "- Revision: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Log out of GHCR
        if: always()
        run: docker logout "$REGISTRY"
