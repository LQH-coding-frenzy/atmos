name: Container release

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release-containers.yml
      - jobs/**
      - scripts/ghcr-publish.test.mjs
      - scripts/container-supply-chain.mjs
      - scripts/container-supply-chain.test.mjs
  push:
    branches: [main]
    paths:
      - .github/workflows/release-containers.yml
      - jobs/**
      - scripts/ghcr-publish.test.mjs
      - scripts/container-supply-chain.mjs
      - scripts/container-supply-chain.test.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atmos-container-release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/atmos-jobs
  TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build hardened job image without registry access
        run: >-
          docker build
          --build-arg SOURCE_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          --build-arg REVISION="$GITHUB_SHA"
          --tag atmos-jobs:validation
          jobs/runtime-probe
      - name: Verify hardened image and OCI identity
        run: |
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' atmos-jobs:validation)" = "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' atmos-jobs:validation)" = "$GITHUB_SHA"
          test "$(docker image inspect --format '{{ .Config.User }}' atmos-jobs:validation)" = 'node:node'
          test "$(docker image inspect --format '{{ json .Config.Entrypoint }}' atmos-jobs:validation)" = '["node","/app/job.mjs"]'
      - name: Scan validation image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: atmos-jobs:validation
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: 'false'
          version: v0.74.0
      - name: Generate validation CycloneDX SBOM
        env:
          SBOM_PATH: artifacts/atmos-jobs-validation.cdx.json
        run: |
          mkdir -p artifacts
          trivy image --scanners vuln --format cyclonedx --output "$SBOM_PATH" atmos-jobs:validation
          node scripts/container-supply-chain.mjs validate-sbom "$SBOM_PATH"
      - name: Execute finite runtime contract
        run: |
          output="$(docker run --rm --read-only --network=none --cap-drop=ALL --security-opt=no-new-privileges \
            --env ATMOS_JOB_ID=ci-validation \
            --env ATMOS_RELEASE_ID="${GITHUB_SHA::12}" \
            atmos-jobs:validation)"
          OUTPUT="$output" node -e "const events=process.env.OUTPUT.split('\\n').map(JSON.parse);if(events.length!==2||events[0].event!=='job_started'||events[1].event!=='job_completed'||events[1].status!=='ok')process.exit(1)"
          if docker run --rm --read-only --network=none --cap-drop=ALL --security-opt=no-new-privileges \
            --env ATMOS_JOB_ID=ci-validation \
            --env ATMOS_RELEASE_ID=invalid \
            atmos-jobs:validation; then
            echo 'Malformed runtime identity unexpectedly succeeded.' >&2
            exit 1
          fi

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Define immutable image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: type=sha,format=long,prefix=sha-
      - name: Reject an existing immutable tag
        env:
          IMAGE_TAG: ${{ steps.metadata.outputs.tags }}
        run: |
          [[ "$IMAGE_TAG" != *$'\n'* ]]
          [[ "$IMAGE_TAG" == *":sha-$GITHUB_SHA" ]]
          if docker buildx imagetools inspect "$IMAGE_TAG" >/dev/null 2>&1; then
            echo 'The immutable Git SHA tag already exists; refusing to overwrite it.' >&2
            exit 1
          fi
      - name: Build exact Git revision for scanning
        id: build
        env:
          IMAGE_TAG: ${{ steps.metadata.outputs.tags }}
        run: |
          docker build \
            --build-arg SOURCE_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --build-arg REVISION="$GITHUB_SHA" \
            --tag "$IMAGE_TAG" \
            jobs/runtime-probe
          CONFIG_DIGEST="$(docker image inspect --format '{{.Id}}' "$IMAGE_TAG")"
          [[ "$CONFIG_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "config_digest=$CONFIG_DIGEST" >> "$GITHUB_OUTPUT"
      - name: Scan exact image before publication
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.metadata.outputs.tags }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: 'false'
          version: v0.74.0
      - name: Generate exact image CycloneDX SBOM
        env:
          IMAGE_TAG: ${{ steps.metadata.outputs.tags }}
          SBOM_PATH: artifacts/atmos-jobs-${{ github.sha }}.cdx.json
        run: |
          mkdir -p artifacts
          trivy image --scanners vuln --format cyclonedx --output "$SBOM_PATH" "$IMAGE_TAG"
          node scripts/container-supply-chain.mjs validate-sbom "$SBOM_PATH"
      - name: Retain exact image SBOM
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: atmos-jobs-sbom-${{ github.sha }}
          path: artifacts/atmos-jobs-${{ github.sha }}.cdx.json
          if-no-files-found: error
          retention-days: 14
      - name: Log in with the ephemeral workflow token
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish scanned image and verify config identity
        id: publish
        env:
          IMAGE_TAG: ${{ steps.metadata.outputs.tags }}
          LOCAL_CONFIG_DIGEST: ${{ steps.build.outputs.config_digest }}
        run: |
          docker image push "$IMAGE_TAG"
          DIGEST="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$IMAGE_TAG")"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "$IMAGE_TAG@$DIGEST" >/dev/null
          REMOTE_CONFIG_DIGEST="$(docker buildx imagetools inspect --raw "$IMAGE_TAG@$DIGEST" | jq --exit-status --raw-output '.config.digest')"
          [[ "$REMOTE_CONFIG_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$LOCAL_CONFIG_DIGEST" = "$REMOTE_CONFIG_DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Keylessly sign exact image and attest its SBOM
        env:
          IMAGE_TAG: ${{ steps.metadata.outputs.tags }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          SBOM_PATH: artifacts/atmos-jobs-${{ github.sha }}.cdx.json
        run: |
          IMAGE="${IMAGE_TAG%:*}"
          IMAGE_DIGEST="$IMAGE@$DIGEST"
          [[ "$IMAGE_DIGEST" == *'@sha256:'* ]]
          cosign sign --yes "$IMAGE_DIGEST"
          cosign attest --yes --type cyclonedx --predicate "$SBOM_PATH" "$IMAGE_DIGEST"
      - name: Record signed image identity
        env:
          IMAGE_TAG: ${{ steps.metadata.outputs.tags }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          SBOM_PATH: artifacts/atmos-jobs-${{ github.sha }}.cdx.json
        run: |
          {
            echo '### Signed OCI image'
            echo
            echo "- Image: \`$IMAGE_TAG\`"
            echo "- Digest: \`$DIGEST\`"
            echo "- Exact image: \`$IMAGE_TAG@$DIGEST\`"
            echo "- Revision: \`$GITHUB_SHA\`"
            echo "- CycloneDX SBOM: \`$SBOM_PATH\`"
            echo '- Signature and SBOM attestation: keyless GitHub OIDC via Cosign'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Log out of GHCR
        if: always()
        run: docker logout "$REGISTRY"
