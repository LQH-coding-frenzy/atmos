name: Container release

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release-containers.yml
      - jobs/**
      - scripts/ghcr-publish.test.mjs
  push:
    branches: [main]
    paths:
      - .github/workflows/release-containers.yml
      - jobs/**
      - scripts/ghcr-publish.test.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atmos-container-release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/atmos-jobs

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build hardened job image without registry access
        run: >-
          docker build
          --build-arg SOURCE_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          --build-arg REVISION="$GITHUB_SHA"
          --tag atmos-jobs:validation
          jobs/runtime-probe
      - name: Verify hardened image and OCI identity
        run: |
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' atmos-jobs:validation)" = "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' atmos-jobs:validation)" = "$GITHUB_SHA"
          test "$(docker image inspect --format '{{ .Config.User }}' atmos-jobs:validation)" = 'node:node'
          test "$(docker image inspect --format '{{ json .Config.Entrypoint }}' atmos-jobs:validation)" = '["node","/app/job.mjs"]'
      - name: Execute finite runtime contract
        run: |
          output="$(docker run --rm --read-only --network=none --cap-drop=ALL --security-opt=no-new-privileges \
            --env ATMOS_JOB_ID=ci-validation \
            --env ATMOS_RELEASE_ID="${GITHUB_SHA::12}" \
            atmos-jobs:validation)"
          OUTPUT="$output" node -e "const events=process.env.OUTPUT.split('\\n').map(JSON.parse);if(events.length!==2||events[0].event!=='job_started'||events[1].event!=='job_completed'||events[1].status!=='ok')process.exit(1)"
          if docker run --rm --read-only --network=none --cap-drop=ALL --security-opt=no-new-privileges \
            --env ATMOS_JOB_ID=ci-validation \
            --env ATMOS_RELEASE_ID=invalid \
            atmos-jobs:validation; then
            echo 'Malformed runtime identity unexpectedly succeeded.' >&2
            exit 1
          fi

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Log in with the ephemeral workflow token
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Define immutable image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: type=sha,format=long,prefix=sha-
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
      - name: Reject an existing immutable tag
        env:
          IMAGE_TAG: ${{ steps.metadata.outputs.tags }}
        run: |
          [[ "$IMAGE_TAG" != *$'\n'* ]]
          [[ "$IMAGE_TAG" == *":sha-$GITHUB_SHA" ]]
          if docker buildx imagetools inspect "$IMAGE_TAG" >/dev/null 2>&1; then
            echo 'The immutable Git SHA tag already exists; refusing to overwrite it.' >&2
            exit 1
          fi
      - name: Build and publish exact Git revision
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: jobs/runtime-probe
          push: true
          provenance: false
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            REVISION=${{ github.sha }}
      - name: Verify exact published digest
        env:
          IMAGE_TAG: ${{ steps.metadata.outputs.tags }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "$IMAGE_TAG@$DIGEST" >/dev/null
          {
            echo '### Published OCI image'
            echo
            echo "- Image: \`$IMAGE_TAG\`"
            echo "- Digest: \`$DIGEST\`"
            echo "- Revision: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Log out of GHCR
        if: always()
        run: docker logout "$REGISTRY"
