name: Backup container release

on:
  pull_request:
    branches: [main]
    paths:
      [
        jobs/database-backup/**,
        scripts/database-backup-container.test.mjs,
        .github/workflows/release-backup-container.yml,
      ]
  push:
    branches: [main]
    paths:
      [
        jobs/database-backup/**,
        scripts/database-backup-container.test.mjs,
        .github/workflows/release-backup-container.yml,
      ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: node --test scripts/database-backup-container.test.mjs
      - run: docker build --build-arg SOURCE_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --build-arg REVISION="$GITHUB_SHA" --tag atmos-database-backup:validation jobs/database-backup
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: atmos-database-backup:validation
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: 'false'
          version: v0.74.0
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: build
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/atmos-database-backup"
          tag="$image:sha-$GITHUB_SHA"
          if docker buildx imagetools inspect "$tag" >/dev/null 2>&1; then exit 1; fi
          docker build --build-arg SOURCE_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --build-arg REVISION="$GITHUB_SHA" --tag "$tag" jobs/database-backup
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.build.outputs.tag }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: 'false'
          version: v0.74.0
      - run: trivy image --scanners vuln --format cyclonedx --output backup.cdx.json "${{ steps.build.outputs.tag }}"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: publish
        run: |
          docker image push "${{ steps.build.outputs.tag }}"
          echo "digest=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "${{ steps.build.outputs.tag }}")" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - run: |
          image="${{ steps.build.outputs.tag }}@${{ steps.publish.outputs.digest }}"
          cosign sign --yes "$image"
          cosign attest --yes --type cyclonedx --predicate backup.cdx.json "$image"
